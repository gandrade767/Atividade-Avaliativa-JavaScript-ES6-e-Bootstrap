<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Painel de Notas</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Painel de Notas</a>
            </div>
        </nav>
    </header>

    <main class="container mt-5 flex-grow-1">

        <section id="apresentacao" class="mb-5">

            <div class="row">
                <div class="col-12">
                    <h1>Painel de Notas</h1>
                    <p class="text-muted">
                        Acompanhe suas notas e seu desempenho acadêmico.
                    </p>
                </div>
            </div>

        </section>

        <section id="notas" class="mb-5">
            <h2>Minhas notas</h2>

            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Nota 1</h5>
                            <p class="card-text">9,0</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Nota 2</h5>
                            <p class="card-text">8,0</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Média Final</h5>
                            <p class="card-text">8,5</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="resultado" class="mb-5">
            <h2>Resultado Acadêmico</h2>

            <span class="badge bg-success">Aprovado</span>

            <div class="alert alert-info mt-3" role="alert">
                A média mínima para aprovação é 7,0.
            </div>

            <button type="button" class="btn btn-primary">
                Ver notas
            </button>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-0">
                © 2026 - Painel de Notas
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>

</html>
